<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
  </head>
  <body>
    <h1 class="main-title">Download Router</h1>
    <h2 class="section-title">Add rules</h2>
    <div class="add-rule-wrapper">
      <input type="text" id="add-rule-input" placeholder="e.g. invoices" />
      <button type="submit" id="add-rule-btn">Add</button>
    </div>
    <div id="rules-list-wrapper">
      <ul id="rules-list"></ul>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
<style>
  :root {
    --spacing-xs: 0.25rem;
    --spacing-sm: 0.5rem;
    --spacing-md: 1rem;
    --radius: 6px;

    --color-bg: #ffffff;
    --color-text: #1a1a1a;
    --color-muted: #6b6b6b;
    --color-border: #d6d6d6;
    --color-primary: #3a7afe;
    --color-primary-text: #ffffff;
    --color-row-hover: #f4f4f5;
    --color-danger: #e5484d;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --color-bg: #1f1b24;
      --color-text: #ffffff;
      --color-muted: #a0a0a8;
      --color-border: #3a3640;
      --color-primary: #5b8dff;
      --color-primary-text: #0f0f12;
      --color-row-hover: #2a2630;
      --color-danger: #ff6b6f;
    }
  }

  * {
    box-sizing: border-box;
  }

  body {
    width: 300px;
    padding: var(--spacing-md);
    font-family: system-ui, -apple-system, sans-serif;
    background-color: var(--color-bg);
    color: var(--color-text);
    color-scheme: light dark;
  }

  .main-title {
    font-size: 16px;
    font-weight: 600;
    text-align: left;
    margin: 0 0 var(--spacing-md) 0;
  }

  .section-title {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--color-muted);
    margin: 0 0 var(--spacing-sm) 0;
  }

  .add-rule-wrapper {
    display: flex;
    gap: var(--spacing-sm);
  }

  input {
    flex: 1;
    padding: var(--spacing-sm);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    background-color: var(--color-bg);
    color: var(--color-text);
    font-size: 13px;
  }

  input:focus {
    outline: none;
    border-color: var(--color-primary);
  }

  button {
    cursor: pointer;
    border: none;
    border-radius: var(--radius);
    font-size: 13px;
  }

  #add-rule-btn {
    padding: var(--spacing-sm) var(--spacing-md);
    background-color: var(--color-primary);
    color: var(--color-primary-text);
    font-weight: 600;
  }

  #add-rule-btn:hover {
    opacity: 0.9;
  }

  #rules-list-wrapper {
    margin-top: var(--spacing-md);
  }

  ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  #rules-list li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: var(--spacing-sm);
    border-radius: var(--radius);
  }

  #rules-list li:hover {
    background-color: var(--color-row-hover);
  }

  #rules-list button {
    visibility: hidden;
    background: none;
    color: var(--color-danger);
    padding: 0 var(--spacing-xs);
    font-size: 12px;
  }

  #rules-list li:hover button {
    visibility: visible;
  }

  #rules-list:empty::after {
    content: "No rules yet — add one above.";
    display: block;
    padding: var(--spacing-sm) 0;
    color: var(--color-muted);
    font-size: 12px;
  }
</style>
